        function renderGrid() {
            const grid = document.getElementById('states-grid');
            grid.innerHTML = statesData.map((state, index) => `
                <div onclick="openModal(${index})" class="bg-white rounded-2xl overflow-hidden shadow-lg border-2 border-amber-300 hover:scale-105 transition duration-300 cursor-pointer flex flex-col">
                    <div class="grid grid-cols-2 h-44">
                        <div class="relative overflow-hidden border-r border-amber-200" title="Monument / Architecture">
                            <img src="${state.image}" alt="${state.name} Monument" class="w-full h-full object-cover">
                            <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Monument</span>
                        </div>
                        <div class="relative overflow-hidden" title="Traditional Food">
                            <img src="${state.foodImage}" alt="${state.name} Traditional Food" class="w-full h-full object-cover">
                            <span class="absolute bottom-1 left-1 bg-orange-800/80 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Cuisine</span>
                        </div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                        <h3 class="text-xl font-bold text-orange-900">${state.name}</h3>
                        <p class="text-xs font-semibold text-gray-700 italic">${state.tagline}</p>
                        <p class="text-xs text-gray-600 line-clamp-2"><strong>Food Specialty:</strong> ${state.foodSpecialty}</p>
                        <span class="text-xs font-bold text-orange-800 underline mt-1">Explore Full Gallery & Culture →</span>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            const state = statesData[index];
            const modal = document.getElementById('state-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="space-y-6">
                    <div class="text-center">
                        <span class="bg-orange-100 text-orange-900 px-3 py-1 rounded-full text-xs font-bold uppercase">Living Cultural Archive</span>
                        <h2 class="text-3xl font-extrabold text-orange-900 mt-2">${state.name}</h2>
                        <p class="text-sm font-semibold text-gray-600 italic mt-1">${state.tagline}</p>
                    </div>

                    <!-- Dual Image Showcase Inside Modal -->
                    <div class="grid md:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <div class="h-56 rounded-2xl overflow-hidden border-2 border-amber-300 shadow-md">
                                <img src="${state.image}" alt="${state.name} Monument" class="w-full h-full object-cover">
                            </div>
                            <p class="text-center text-xs font-bold text-orange-900">🏛️ Heritage Monument & Architecture</p>
                        </div>
                        <div class="space-y-2">
                            <div class="h-56 rounded-2xl overflow-hidden border-2 border-amber-300 shadow-md">
                                <img src="${state.foodImage}" alt="${state.name} Traditional Food" class="w-full h-full object-cover">
                            </div>
                            <p class="text-center text-xs font-bold text-orange-900">🍲 Traditional Cuisine & Delicacy</p>
                        </div>
                    </div>
                    
                    <div class="space-y-3 text-sm">
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <strong class="text-orange-900 block mb-1">🍲 Culinary Specialty:</strong>
                            <p class="text-gray-700">${state.foodSpecialty}</p>
                        </div>
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <strong class="text-orange-900 block mb-1">🏛️ Key Destinations & Monuments:</strong>
                            <p class="text-gray-700">${state.destinations}</p>
                        </div>
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <strong class="text-orange-900 block mb-1">🎭 Cultural & Artistic Fabric:</strong>
                            <p class="text-gray-700">${state.culture}</p>

        }

        function closeModal() {
            document.getElementById('state-modal').classList.add('hidden');

        function renderGrid() {
            const grid = document.getElementById('states-grid');
            grid.innerHTML = statesData.map((state, index) => `
                <div onclick="openModal(${index})" class="bg-white rounded-2xl overflow-hidden shadow-lg border-2 border-amber-300 hover:scale-105 transition duration-300 cursor-pointer flex flex-col">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${state.image}" alt="${state.name}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent flex items-end p-4">
                            <h3 class="text-white text-xl font-bold">${state.name}</h3>
                        </div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                        <p class="text-xs font-semibold text-orange-800 uppercase">${state.tagline}</p>
                        <p class="text-xs text-gray-600 line-clamp-2"><strong>Destinations:</strong> ${state.destinations}</p>
                        <span class="text-xs font-bold text-amber-900 underline mt-2">Explore Cultural Profile →</span>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            const state = statesData[index];
            const modal = document.getElementById('state-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="space-y-4">
                    <div class="relative h-64 rounded-2xl overflow-hidden border-2 border-amber-300">
                        <img src="${state.image}" alt="${state.name}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex items-end p-6">
                            <div>
                                <span class="bg-orange-600 text-white px-3 py-1 rounded-full text-xs font-bold uppercase">State Profile</span>
                                <h2 class="text-3xl font-extrabold text-white mt-1">${state.name}</h2>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm font-semibold text-orange-800 italic">${state.tagline}</p>
                    
                    <div class="space-y-3 text-sm">
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <strong class="text-orange-900 block mb-1">🏛️ Key Destinations & Monuments:</strong>
                            <p class="text-gray-700">${state.destinations}</p>
                        </div>
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <strong class="text-orange-900 block mb-1">🎭 Cultural & Artistic Fabric:</strong>
                            <p class="text-gray-700">${state.culture}</p>
                        </div>
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <strong class="text-orange-900 block mb-1">📐 Architectural Engineering Heritage:</strong>
                            <p class="text-gray-700">${state.architecture}</p>
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('state-modal').classList.add('hidden');
        }

        window.onload = renderGrid;

</body>
